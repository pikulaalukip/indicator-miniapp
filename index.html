<style>
/* Белая минималистичная тема: одна колонка как в Telegram Mini App, чёрные кнопки, зелёный/красный только для рынка */
:root {
  --bg: #FFFFFF;
  --fg: #0A0A0A;

}
* { box-sizing: border-box; }

.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 22px;
  padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* живой график */
.live { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 16px max(16px, env(safe-area-inset-left, 0px)); background: #FAFAFA; border-block: 1px solid #EDEDED; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

@keyframes blink { 50% { opacity: .25; } }

.chart.small-h { height: 300px; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

.list { display: flex; flex-direction: column; border-top: 1px solid #EDEDED; }

.table { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; font-family: var(--mono); font-size: 14px; }
.table > div { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #EDEDED; }
.table > div:last-child { border-bottom: 0; }
.bar { height: 6px; border-radius: 3px; background: #EDEDED; } .bar > i { display: block; height: 6px; border-radius: 3px; }

.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

.seg button[aria-pressed="true"] { background: #FFF; color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 13px; color: #555; }
.input { min-height: 50px; border-radius: 12px; border: 1px solid #DADADA; background: var(--soft); padding: 0 14px; font-size: 16px; color: var(--fg); width: 100%; }

.plan[aria-pressed="true"] { border-color: var(--up); background: #EEF7F2; }
.plan .ring { width: 20px; height: 20px; border-radius: 10px; border: 2px solid #C4C4C4; flex-shrink: 0; }
.plan[aria-pressed="true"] .ring { border: 6px solid var(--up); }
.plan .nm { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.steps div { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #6B6B6B; }
.steps div::before { content: ""; height: 3px; border-radius: 2px; background: #E4E4E4; }
.steps .done { color: var(--up); } .steps .done::before { background: var(--up); }
.steps .now { color: var(--fg); font-weight: 600; } .steps .now::before { background: var(--fg); }
.ok { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #EEF7F2; border: 1px solid var(--up); }
.check { color: var(--up); font-size: 13px; }

nav.tabs { position: sticky; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid #EDEDED; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
nav.tabs button { border: 0; background: none; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B6B6B; }
nav.tabs button[aria-current="page"] { color: var(--fg); font-weight: 600; }
nav.tabs svg { width: 22px; height: 22px; }
</style>

<div class="app">
  <div id="view" class="screen" aria-live="polite"></div>
  <nav class="tabs" aria-label="Разделы">

    <button data-tab="analyze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Анализ</button>
    <button data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18"/></svg>Доступ</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
  </nav>

<script>
(() => {
// ---------- настройки (совпадают с indicator_final.pine) ----------
const CFG = {
  sens: 1.0, atrLen: 11, emaLen: 50,
  tp: [1.618, 2.618, 4.236], sl: 1.618,
  r: [1, 2, 3], slBuf: 0.2, // режим «От линии трейлинга (R)»
  statN: 30, good: 60, bad: 45,
  pfBars: 360, pfRows: 80, vaPct: 70,
  channel: "https://t.me/+ek0gaMHzPEZjMzJi",
  chat: "https://t.me/+yiCccBnnIScxZGMy",
  support: "https://t.me/pikulaalukip", // ваш личный Telegram для вопросов
  plans: [
    { id: "m1", name: "1 месяц", note: "попробовать", price: 99, days: 30 },
    { id: "m3", name: "3 месяца", note: "≈ $70 в месяц, экономия 29%", price: 211, days: 90 },
    { id: "life", name: "Навсегда", note: "один платёж, без продлений", price: 499, days: 0 }
  ],
  coins: ["BTC", "ETH", "SOL", "TON", "XRP", "BNB", "DOGE", "SUI"]
};
const REST = ["https://data-api.binance.vision/api/v3/klines", "https://api.binance.com/api/v3/klines"];
const WS = "wss://data-stream.binance.vision/ws/";

const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#FFFFFF"); tg.setBackgroundColor("#FFFFFF"); } catch (e) {} }
const supportBtn = (label) => `<a class="btn ghost" href="${CFG.support}" target="_blank" rel="noopener" data-support>${label || "Написать в поддержку"}</a>`;
const haptic = (t) => { try { tg && tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };

// ---------- хранилище (в демо-режиме всё хранится в браузере) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("ind_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ind_" + k, JSON.stringify(v)); } catch (e) {} }
};
const weekId = () => { const d = new Date(); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - day); return t.toISOString().slice(0, 10); };
const nextWeekDate = () => { const d = new Date(weekId()); d.setDate(d.getDate() + 7); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }); };

// ---------- форматирование ----------
const fmt = (p) => p == null || isNaN(p) ? "—" : p.toLocaleString("ru-RU", { maximumFractionDigits: p >= 1000 ? 1 : p >= 1 ? 3 : 6, minimumFractionDigits: p >= 1000 ? 1 : p >= 1 ? 2 : 4 });
const pct = (n, d) => d > 0 ? Math.round(100 * n / d) : 0;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- данные ----------
async function loadKlines(symbol, interval, limit) {
  for (const base of REST) {
    try {
      const r = await fetch(`${base}?symbol=${symbol}&interval=${interval}&limit=${limit}`);
      if (!r.ok) { if (r.status === 400) throw new Error("bad_symbol"); continue; }
      const a = await r.json();
      return { live: true, bars: a.map((k) => ({ time: Math.floor(k[0] / 1000), open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5], closed: k[6] < Date.now() })) };
    } catch (e) { if (e.message === "bad_symbol") throw e; }
  }
  return { live: false, bars: demoBars(symbol, interval, limit) };
}
// запасные демо-свечи, если биржа недоступна (например, в предпросмотре)
function demoBars(symbol, interval, n) {
  let seed = [...symbol + interval].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const step = { "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400, "1w": 604800 }[interval] || 3600;
  const base = { BTC: 60000, ETH: 3000, SOL: 150, TON: 5, XRP: .6, BNB: 550, DOGE: .15, SUI: 2 }[symbol.replace("USDT", "")] || 10;
  const vol = interval === "1w" ? .07 : interval === "1d" ? .03 : .012;
  let p = base * .55, t = Math.floor(Date.now() / 1000 / step) * step - (n - 1) * step, drift = 0;
  const out = [];
  for (let i = 0; i < n; i++) {
    if (i % 40 === 0) drift = (rnd() - .45) * vol * .35;
    const o = p, c = Math.max(o * (1 + drift + (rnd() - .5) * vol), base * .05);
    const h = Math.max(o, c) * (1 + rnd() * vol * .5), l = Math.min(o, c) * (1 - rnd() * vol * .5);
    out.push({ time: t + i * step, open: o, high: h, low: l, close: c, volume: 1000 + rnd() * 5000, closed: i < n - 1 });
    p = c;
  }
  return out;
}

// ---------- индикатор (перенос логики Pine) ----------
function compute(bars, mode) {
  const n = bars.length, C = bars.map((b) => b.close), H = bars.map((b) => b.high), L = bars.map((b) => b.low);
  // ATR (RMA)
  const atr = new Array(n).fill(NaN);
  let sum = 0;
  for (let i = 0; i < n; i++) {
    const tr = i === 0 ? H[i] - L[i] : Math.max(H[i] - L[i], Math.abs(H[i] - C[i - 1]), Math.abs(L[i] - C[i - 1]));
    if (i < CFG.atrLen) { sum += tr; if (i === CFG.atrLen - 1) atr[i] = sum / CFG.atrLen; }
    else atr[i] = (atr[i - 1] * (CFG.atrLen - 1) + tr) / CFG.atrLen;
  }
  // EMA
  const ema = new Array(n).fill(NaN); const k = 2 / (CFG.emaLen + 1);
  for (let i = 0; i < n; i++) ema[i] = i === 0 ? C[0] : C[i] * k + ema[i - 1] * (1 - k);
  // линия трейлинга
  const stop = new Array(n).fill(NaN);
  for (let i = 0; i < n; i++) {
    const prev = i > 0 && !isNaN(stop[i - 1]) ? stop[i - 1] : 0, s = CFG.sens * atr[i], p = C[i], p1 = i > 0 ? C[i - 1] : NaN;
    if (isNaN(s)) continue;
    stop[i] = p > prev && p1 > prev ? Math.max(prev, p - s) : p < prev && p1 < prev ? Math.min(prev, p + s) : p > prev ? p - s : p + s;
  }
  // сигналы только по закрытым свечам
  const signals = [];
  for (let i = 1; i < n; i++) {
    if (!bars[i].closed || isNaN(stop[i]) || isNaN(stop[i - 1])) continue;
    if (C[i] > stop[i] && C[i - 1] <= stop[i - 1]) signals.push({ i, dir: 1 });
    else if (C[i] < stop[i] && C[i - 1] >= stop[i - 1]) signals.push({ i, dir: -1 });
  }
  // сделки и статистика
  const res = []; let tr = null;
  const levels = (entry, dir, i) => {
    if (mode === "R") {
      const sl = stop[i] - dir * CFG.slBuf * atr[i], risk = Math.abs(entry - sl);
      return { entry, sl, tp: CFG.r.map((r) => entry + dir * r * risk) };
    }
    return { entry, tp: CFG.tp.map((t) => entry * (1 + dir * t / 100)), sl: entry * (1 - dir * CFG.sl / 100) };
  };
  let si = 0;
  for (let i = 0; i < n; i++) {
    if (!bars[i].closed) break;
    if (si < signals.length && signals[si].i === i) {
      if (tr && tr.open) { res.push(tr.stage > 0 ? tr.stage : -1); tr.open = false; tr.result = tr.stage > 0 ? tr.stage : -1; }
      const dir = signals[si].dir; tr = { i, dir, time: bars[i].time, open: true, stage: 0, ...levels(C[i], dir, i) }; signals[si].trade = tr; si++;
      continue;
    }
    if (tr && tr.open) {
      if (tr.dir === 1 ? L[i] <= tr.sl : H[i] >= tr.sl) { tr.open = false; tr.result = tr.stage; res.push(tr.stage); }
      else {
        const fav = tr.dir === 1 ? H[i] : L[i];
        const reached = tr.dir * (fav - tr.tp[2]) >= 0 ? 3 : tr.dir * (fav - tr.tp[1]) >= 0 ? 2 : tr.dir * (fav - tr.tp[0]) >= 0 ? 1 : 0;
        if (reached > tr.stage) { tr.stage = reached; if (reached === 3) { tr.open = false; tr.result = 3; res.push(3); } }
      }
    }
  }
  const last = res.slice(-CFG.statN), d = last.length;
  const st = { n: d, tp1: last.filter((r) => r >= 1).length, tp2: last.filter((r) => r >= 2).length, tp3: last.filter((r) => r >= 3).length, sl: last.filter((r) => r === 0).length, rev: last.filter((r) => r === -1).length };
  st.pass = pct(st.tp1, d);
  st.verdict = d < 10 ? ["мало сделок", ""] : st.pass >= CFG.good ? ["ХОРОШО", "good"] : st.pass >= CFG.bad ? ["СРЕДНЕ", "mid"] : ["ПЛОХО", "bad"];
  return { atr, ema, stop, signals, trade: tr, stats: st, profile: profile(bars) };
}
function profile(bars) {
  const len = Math.min(CFG.pfBars, bars.length), part = bars.slice(-len), rows = CFG.pfRows;
  const hi = Math.max(...part.map((b) => b.high)), lo = Math.min(...part.map((b) => b.low)), step = (hi - lo) / rows;
  if (!(step > 0)) return null;
  const tot = new Array(rows).fill(0); let buy = 0, all = 0;
  for (const b of part) {
    const rng = b.high - b.low, bs = rng > 0 ? (b.close - b.low) / rng : .5;
    const r0 = Math.max(0, Math.min(rows - 1, Math.floor((b.low - lo) / step))), r1 = Math.max(r0, Math.min(rows - 1, Math.floor((b.high - lo) / step)));
    for (let r = r0; r <= r1; r++) {
      const rl = lo + r * step, f = rng > 0 ? Math.max(0, Math.min(b.high, rl + step) - Math.max(b.low, rl)) / rng : 1;
      tot[r] += b.volume * f;
    }
    buy += b.volume * bs; all += b.volume;
  }
  const vMax = Math.max(...tot), sumV = tot.reduce((a, b) => a + b, 0), poc = tot.indexOf(vMax);
  let a = poc, z = poc, acc = vMax; const target = sumV * CFG.vaPct / 100;
  while (acc < target && (a > 0 || z < rows - 1)) {
    const up = z < rows - 1 ? tot[z + 1] : -1, dn = a > 0 ? tot[a - 1] : -1;
    if (up >= dn) { z++; acc += up; } else { a--; acc += dn; }
  }
  return { poc: lo + (poc + .5) * step, vah: lo + (z + 1) * step, val: lo + a * step, buyPct: all > 0 ? Math.round(100 * buy / all) : 50 };
}

// ---------- график ----------
let active = []; // открытые графики и сокеты текущего экрана
function cleanup() { for (const a of active) { try { a.ws && a.ws.close(); } catch (e) {} try { a.chart && a.chart.remove(); } catch (e) {} } active = []; }

async function mountChart(el, symbol, interval, onUpdate, mode) {
  const LW = window.LightweightCharts;
  const holder = { symbol, interval };
  active.push(holder);
  let data;
  try { data = await loadKlines(symbol, interval, interval === "1w" ? 500 : 600); }
  catch (e) { onUpdate({ error: "Монета не найдена на Binance. Проверьте тикер." }); return; }
  if (!active.includes(holder)) return;
  let bars = data.bars, calc = compute(bars, mode);
  if (!LW) { el.innerHTML = '<div class="notice" style="margin:12px">График не загрузился. Проверьте интернет и откройте приложение снова.</div>'; onUpdate({ bars, calc, live: data.live }); return; }
  const chart = LW.createChart(el, {
    autoSize: true,
    layout: { background: { type: "solid", color: "#FFFFFF" }, textColor: "#5E5E5E", fontFamily: "Inter, system-ui, sans-serif", fontSize: 11 },
    grid: { vertLines: { color: "#F2F2F2" }, horzLines: { color: "#F2F2F2" } },
    rightPriceScale: { borderColor: "#E8E8E8" },
    timeScale: { borderColor: "#E8E8E8", rightOffset: 6, barSpacing: interval === "1w" ? 7 : 6 },
    crosshair: { mode: 0 },
    handleScale: { axisPressedMouseMove: true }
  });
  holder.chart = chart;
  const candles = chart.addCandlestickSeries({ upColor: "#00B377", downColor: "#E5484D", borderVisible: false, wickUpColor: "#00B377", wickDownColor: "#E5484D" });
  const emaS = chart.addLineSeries({ color: "#9C7CF4", lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  const stopS = chart.addLineSeries({ color: "rgba(10,10,10,.35)", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  let lines = [];
  const draw = () => {
    calc = compute(bars, mode);
    candles.setData(bars.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
    emaS.setData(bars.map((b, i) => ({ time: b.time, value: calc.ema[i] })));
    stopS.setData(bars.map((b, i) => isNaN(calc.stop[i]) ? { time: b.time } : { time: b.time, value: calc.stop[i] }));
    candles.setMarkers(calc.signals.map((s) => s.dir === 1
      ? { time: bars[s.i].time, position: "belowBar", color: "#00804F", shape: "arrowUp", text: "BUY" }
      : { time: bars[s.i].time, position: "aboveBar", color: "#D32F2F", shape: "arrowDown", text: "SELL" }));
    lines.forEach((l) => candles.removePriceLine(l)); lines = [];
    const add = (price, color, title, style) => lines.push(candles.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title }));
    const t = calc.trade;
    if (t) {
      add(t.entry, "#6B6B6B", "Вход", 0);
      t.tp.forEach((p, j) => add(p, "#00804F", "TP" + (j + 1) + (t.stage > j ? " ✓" : ""), 2));
      add(t.sl, "#D32F2F", "SL", 2);
    }
    if (calc.profile) { add(calc.profile.poc, "#A87900", "POC", 0); add(calc.profile.vah, "#1E6FD9", "VAH", 1); add(calc.profile.val, "#1E6FD9", "VAL", 1); }
    onUpdate({ bars, calc, live: data.live });
  };
  draw();
  chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, bars.length - (interval === "1w" ? 90 : 120)), to: bars.length + 4 });

  if (data.live && "WebSocket" in window) {
    const connect = () => {
      const ws = new WebSocket(`${WS}${symbol.toLowerCase()}@kline_${interval}`);
      holder.ws = ws;
      let pending = false;
      ws.onmessage = (ev) => {
        const k = JSON.parse(ev.data).k; if (!k) return;
        const b = { time: Math.floor(k.t / 1000), open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v, closed: !!k.x };
        const last = bars[bars.length - 1];
        if (last && last.time === b.time) bars[bars.length - 1] = b; else if (!last || b.time > last.time) bars.push(b);
        if (b.closed) { draw(); return; }
        candles.update({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close });
        if (!pending) { pending = true; setTimeout(() => { pending = false; onUpdate({ bars, calc, live: true, tick: true }); }, 500); }
      };
      ws.onclose = () => { if (active.includes(holder)) setTimeout(connect, 3000); };
    };
    connect();
  }
}

function statsBlock(st, title) {
  return `<div style="display:flex;flex-direction:column;gap:8px">
    <div class="row"><span style="font-size:13px;color:#555">${title}</span><span class="verdict ${st.verdict[1]}">${st.verdict[0]}</span></div>

      <div class="tile"><b>${st.n ? pct(st.tp2, st.n) + "%" : "—"}</b><span>дошли до TP2</span></div>
      <div class="tile"><b style="color:var(--down)">${st.n ? pct(st.sl, st.n) + "%" : "—"}</b><span>по стопу</span></div>
    </div>
    <span class="small">Закрытых сделок в расчёте: ${st.n}${st.rev ? ` · обратный сигнал до TP1: ${st.rev}` : ""}</span>
  </div>`;
}
function tradeText(t) {
  if (!t) return "сигналов пока нет";
  const s = t.open ? (t.stage ? `TP${t.stage} взят, идёт к TP${t.stage + 1}` : "ждёт TP1") : t.result >= 1 ? `закрыта на TP${t.result}` : t.result === 0 ? "закрыта по стопу" : "закрыта обратным сигналом";
  return s;
}

      <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">ДОСТУП</span><h1>Индикатор в вашем TradingView</h1></div>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:14px">
        <div>✓ Закрытый скрипт, выдаём по нику TradingView</div><div>✓ Анализ любых монет здесь без ограничений</div><div>✓ Закрытый чат и инструкция по настройке</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">${CFG.plans.map((x) => `<button class="plan" data-plan="${x.id}" aria-pressed="${x.id === state.plan}"><span class="ring" aria-hidden="true"></span><span class="nm"><b style="font-size:16px">${x.name}</b><span class="small">${x.note}</span></span><span class="mono" style="font-weight:600">$${x.price}</span></button>`).join("")}</div>
      <div class="field"><span style="font-size:13px;color:#555">Монета для оплаты · через CryptoBot</span>
        <div class="seg" style="--n:3" role="group" aria-label="Монета для оплаты">${["USDT", "TON", "BTC"].map((c) => `<button data-pay="${c}" aria-pressed="${state.payCoin === c}">${c}</button>`).join("")}</div></div>
      <button class="btn" data-go="pay">Оплатить $${p.price} · ${p.name}</button>`;
  },

  pay() {
    const p = CFG.plans.find((x) => x.id === state.plan);
    if (!state.invoice) state.invoice = { no: 10000 + Math.floor(Math.random() * 90000), until: Date.now() + 30 * 60000, paid: false };
    const inv = state.invoice;
    view.innerHTML = `${header("plans")}
      <div class="steps"><div class="now">Оплата</div><div>Ник TradingView</div><div>Доступ</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">СЧЁТ № ${inv.no}</span><h1>Оплата криптой</h1></div>
      <div class="card" style="padding:0;gap:0">
        <div style="padding:18px 16px;border-bottom:1px solid #EDEDED;display:flex;flex-direction:column;gap:4px"><span class="small" style="color:#555">К оплате</span>
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="price" style="font-size:36px">$${p.price}</span><span class="mono" style="color:#555">в ${state.payCoin} по курсу CryptoBot</span></div></div>
        <div class="kv" style="padding:14px 16px"><span>Тариф</span><span>${p.name}</span><span>Монета</span><span class="mono">${state.payCoin}</span><span>Через</span><span>CryptoBot</span><span>Счёт действует</span><span class="mono" id="timer">30:00</span></div>
      </div>
      ${inv.paid ? `<div class="ok"><span style="color:var(--up);font-size:22px" aria-hidden="true">✓</span><div style="display:flex;flex-direction:column"><b>Оплата получена</b><span class="small" style="color:#555">$${p.price} в ${state.payCoin} · подтверждено CryptoBot</span></div></div>
        <button class="btn" data-go="nick">Дальше: ник TradingView</button>`
      : `<div class="notice" style="font-size:14px">Ждём оплату. Окно CryptoBot откроется поверх приложения, подтверждение придёт автоматически.</div>
        <button class="btn" id="payBtn">Оплатить в CryptoBot ↗</button>
        <p class="small" style="text-align:center;margin:-12px 0 0">Тестовая версия: настоящий платёж не создаётся, нажатие имитирует успешную оплату.</p>`}
      ${supportBtn("Проблема с оплатой? Напишите нам")}`;
    const tick = () => { const el = document.getElementById("timer"); if (!el) return; const s = Math.max(0, Math.floor((inv.until - Date.now()) / 1000)); el.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; setTimeout(tick, 1000); };
    tick();
    const b = document.getElementById("payBtn");
    if (b) b.addEventListener("click", () => { b.disabled = true; b.textContent = "Ждём подтверждение…"; setTimeout(() => { inv.paid = true; haptic("heavy"); render(); }, 1500); });
  },

  nick() {
    view.innerHTML = `${header("pay")}
      <div class="steps"><div class="done">Оплата ✓</div><div class="now">Ник TradingView</div><div>Доступ</div></div>
      <div style="display:flex;flex-direction:column;gap:8px"><h1>Оплата получена</h1><p class="lead">Укажите ник в TradingView, на него мы откроем доступ к индикатору.</p></div>
      <form id="nf" class="field"><label for="tv">Ник TradingView</label><input id="tv" class="input mono" required minlength="2" placeholder="например trader_nick" value="${esc(store.get("tv", ""))}" autocomplete="off"><span class="small">Именно ник (username), не почта. Его видно в TradingView: нажмите на аватар, ник под именем.</span>
      <div class="card" style="margin-top:14px"><b>Что дальше</b><span style="font-size:14px;color:#333">1. Откроем доступ в течение [срок] и пришлём уведомление в Telegram.<br>2. TradingView → Индикаторы → Только по приглашению → INDICATOR.</span></div>
      <button class="btn" style="margin-top:14px">Отправить ник</button></form>
      ${supportBtn("Вопрос по оплате или доступу? Напишите нам")}`;
    document.getElementById("nf").addEventListener("submit", (e) => {
      e.preventDefault(); const nick = document.getElementById("tv").value.trim(); if (!nick) return;
      const p = CFG.plans.find((x) => x.id === state.plan);
      store.set("tv", nick); store.set("access", { plan: p.id, name: p.name, since: Date.now(), until: p.days ? Date.now() + p.days * 86400000 : 0, status: "pending" });
      state.invoice = null; haptic("medium"); go("profile");
    });
  },

  profile() {
    const a = access(), u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    const name = u ? [u.first_name, u.last_name].filter(Boolean).join(" ") : "Гость";
    const left = a && a.until ? Math.ceil((a.until - Date.now()) / 86400000) : null;
    view.innerHTML = `${header()}
      <div style="display:flex;align-items:center;gap:14px"><div style="width:56px;height:56px;border-radius:28px;background:#EDEDED;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600">${esc(name.slice(0, 1).toUpperCase())}</div>
        <div style="display:flex;flex-direction:column"><b style="font-size:18px">${esc(name)}</b><span class="small">${u && u.username ? "@" + esc(u.username) : "откройте в Telegram, чтобы видеть свой профиль"}</span></div></div>
      ${a ? `<div class="card"><div class="row"><b>Доступ к индикатору</b><span class="check">● ${a.status === "pending" ? "выдаётся" : "активен"}</span></div>
        <div style="display:flex;align-items:baseline;gap:8px"><span class="price" style="font-size:34px">${left == null ? "∞" : left}</span><span style="color:#555;font-size:14px">${left == null ? "навсегда" : `дней осталось · до ${new Date(a.until).toLocaleDateString("ru-RU")}`}</span></div>
        <div class="kv"><span>Тариф</span><span>${a.name}</span><span>TradingView</span><span class="mono">${esc(store.get("tv", "—"))}</span><span>Анализ монет</span><span>без ограничений</span></div>
        ${a.status === "pending" ? `<div class="notice">Ник отправлен. Как только откроем доступ в TradingView, бот пришлёт уведомление.</div>` : ""}
        ${a.until ? `<button class="btn" data-go="plans">Продлить</button>` : ""}</div>`
      : `<div class="card"><b>Доступа пока нет</b><span style="font-size:14px;color:#555">Купите доступ, чтобы получить индикатор в TradingView и анализ любых монет.</span><button class="btn" data-go="plans">Купить доступ</button></div>`}
      <div class="list">
        ${a ? `<button data-go="nick" style="border:0;border-bottom:1px solid #EDEDED;background:none;text-align:left;width:100%">Сменить ник TradingView <span aria-hidden="true">›</span></button>` : ""}
        <button data-go="demo" style="border:0;border-bottom:1px solid #EDEDED;background:none;text-align:left;width:100%">Как читать индикатор <span aria-hidden="true">›</span></button>
        <a href="${CFG.channel}" target="_blank" rel="noopener" data-tglink>Наш канал <span aria-hidden="true">↗</span></a>
        <a href="${CFG.chat}" target="_blank" rel="noopener" data-tglink>Наш чат <span aria-hidden="true">↗</span></a>
        <a href="${CFG.support}" target="_blank" rel="noopener" data-support>Поддержка: написать лично <span aria-hidden="true">↗</span></a>
      </div>
      <button class="btn ghost" id="reset" style="min-height:44px;font-size:14px">Тест: сбросить покупку и бесплатную проверку</button>`;
    document.getElementById("reset").addEventListener("click", () => { ["access", "freeWeek", "subs", "tv"].forEach((k) => store.set(k, null)); state.subs = { channel: false, chat: false }; render(); });
    view.querySelectorAll("[data-tglink]").forEach((a) => a.addEventListener("click", (e) => { if (tg) { e.preventDefault(); try { tg.openTelegramLink(a.href); } catch (er) {} } }));
  }
};

const tabOf = { home: "home", demo: "home", analyze: "analyze", result: "analyze", plans: "plans", pay: "plans", nick: "plans", profile: "profile" };
const backOf = { demo: "home", result: "analyze", pay: "plans", nick: "pay" };
function go(name) { state.screen = name; render(); window.scrollTo(0, 0); }
function render() {
  cleanup();
  const name = state.screen || "home";
  screens[name]();
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tabOf[name] ? "page" : "false"));
}
if (tg) { try { tg.BackButton.onClick(() => go(backOf[state.screen] || "home")); } catch (e) {} }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.hasAttribute("data-support")) { if (tg) { e.preventDefault(); try { tg.openTelegramLink(t.href); } catch (er) {} } return; }
  if (t.dataset.tab) { haptic(); go(t.dataset.tab); return; }
  if (t.dataset.go) { haptic(); go(t.dataset.go); return; }
  if (t.dataset.coin) { state.coin = t.dataset.coin; render(); return; }
  if (t.dataset.tf) { state.tf = t.dataset.tf; render(); return; }
  if (t.dataset.demo) { state.demoCoin = t.dataset.demo; render(); return; }
  if (t.dataset.plan) { state.plan = t.dataset.plan; haptic(); render(); return; }
  if (t.dataset.pay) { state.payCoin = t.dataset.pay; render(); return; }
});
render();
})();
</script>
</body></html>
